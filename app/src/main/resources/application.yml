spring:
  application:
    name: my-agent
  datasource:
    url: ${AGENT_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/postgres}
    username: ${AGENT_DATABASE_USERNAME:postgres}
    password: ${AGENT_DATABASE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: hotfix_agent
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    default-schema: hotfix_agent
    liquibase-schema: hotfix_agent
  ai:
    chat:
      observations:
        log-prompt: false
        log-completion: false
      client:
        observations:
          log-prompt: false
          log-completion: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

agent:
  ai:
    input-budget:
      triage:
        max-input-tokens: ${AGENT_AI_TRIAGE_MAX_INPUT_TOKENS:8000}
        max-output-tokens: ${AGENT_AI_TRIAGE_MAX_OUTPUT_TOKENS:1500}
      reasoning:
        max-input-tokens: ${AGENT_AI_REASONING_MAX_INPUT_TOKENS:16000}
        max-output-tokens: ${AGENT_AI_REASONING_MAX_OUTPUT_TOKENS:4000}
      review:
        max-input-tokens: ${AGENT_AI_REVIEW_MAX_INPUT_TOKENS:8000}
        max-output-tokens: ${AGENT_AI_REVIEW_MAX_OUTPUT_TOKENS:1500}
      characters-per-token: ${AGENT_AI_CHARACTERS_PER_TOKEN:3}
  verification:
    parity:
      limits:
        max-patch-retries: 2
        max-workers: ${AGENT_PARITY_MAX_WORKERS:2}
      newman-workspace-root: ${AGENT_NEWMAN_WORKSPACE_ROOT:${AGENT_STATE_PATH:.agent/runtime}}

embabel:
  agent:
    platform:
      llm-operations:
        data-binding:
          max-attempts: ${AGENT_AI_DATA_BINDING_MAX_ATTEMPTS:1}
      models:
        openai:
          max-attempts: ${AGENT_AI_PROVIDER_MAX_ATTEMPTS:1}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: false
