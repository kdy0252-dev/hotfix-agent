<div class="result-card" xmlns:th="http://www.thymeleaf.org">
    <div class="active-agent complete">
        <span class="agent-pulse" aria-hidden="true"></span>
        <div>
            <strong>자연어 분석 완료</strong>
            <small>요청 내용을 안전하게 실행할 수 있는 작업으로 정리했습니다.</small>
        </div>
    </div>
    <div class="card-title-row">
        <span class="status" th:classappend="${interpretation.decision.status}"
              th:text="${interpretation.decision.confirmable ? '실행 준비 완료' : '확인 필요'}">READY</span>
        <strong th:text="${interpretation.decision.intent == 'ANALYZE_JENKINS' ? 'Jenkins 실패 빌드 분석' : '요청 내용 확인'}">
            Jenkins 실패 빌드 분석
        </strong>
    </div>
    <p th:if="${interpretation.decision.intent == 'ANALYZE_JENKINS'}" class="parameter-summary">
        지정한 실패 빌드의 로그와 해당 소스 코드를 함께 분석합니다.
    </p>
    <ul th:if="${!#lists.isEmpty(interpretation.decision.clarificationQuestions)}">
        <li th:each="question : ${interpretation.decision.clarificationQuestions}"
            th:text="${question}">question</li>
    </ul>
    <p th:if="${interpretation.decision.rejectionMessage != null}" class="error-text"
       >요청 대상을 확인하지 못했습니다. “최근 실패 빌드 분석해줘”처럼 분석할 대상을 함께 입력해 주세요.</p>
    <form th:if="${interpretation.decision.confirmable}"
          th:attr="hx-post=@{/ui/natural-language/interpretations/{id}/executions(id=${interpretation.metadata.interpretationId})}"
          hx-target="#command-result" hx-indicator="#execution-loading">
        <input type="hidden" name="version" th:value="${interpretation.metadata.version}">
        <input type="hidden" name="commandHash" th:value="${interpretation.decision.commandHash}">
        <input type="hidden" name="idempotencyKey" th:value="${executionIdempotencyKey}">
        <div class="confirmation-note">
            분석 후 수정 가능한 원인 후보를 보여드립니다. 후보를 선택해야 검증과 Draft PR 생성이 시작됩니다.
        </div>
        <div class="form-actions">
            <span id="execution-loading" class="htmx-indicator">incident-analysis-agent를 시작하고 있습니다…</span>
            <button type="submit" class="primary">이 해석으로 실행</button>
        </div>
    </form>
</div>
